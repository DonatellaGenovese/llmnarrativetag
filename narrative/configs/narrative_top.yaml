# Part 3 narrative pipeline — TopLandscape.
dataset: TopLandscape

# Inputs produced by Part 2 (surrogate/).
inputs:
  features: surrogate/outputs/top/features/features_test.parquet
  model: surrogate/outputs/top/models/ebm.joblib

artefact:
  # schema_version is derived from include_pct, not set here: 1 = no rarity
  # fields, 2 = `pct` and `rarity` per observable.
  #
  # Observables reported per jet, ranked by |phi|. null = all of them.
  top_k: null
  # Position and rarity of each value within the other class.
  include_pct: true
  round:
    value: 2
    phi: 2
    score: 2
    # Two decimals. At integer precision 16.3% of (jet, observable) pairs land
    # on exactly 0 or 100; at one decimal 6.4% of rarities were still a literal
    # 0.0, which reads as "no jet lies further out" and is false.
    pct: 2

# Abstention gate on decisions and ranks (narrative/gate_top.py, 2026-11-13),
# the same scheme as anomaly/gate.py: abstain when the surrogate takes the
# other decision, caveat when it agrees but ranks the jet more than X
# percentile points away from the tagger, X calibrated on val
# (`python -m narrative.gate_top`). Independent of the teacher's logit scale.
#
# Up to v17 the gate was |t_clip - g_hat| < 1.0 full, < 2.0 caveat, else
# abstain, in logit units. Its thresholds came from an earlier teacher; on the
# seed-42 teacher they gave 50% full, 29% caveat, 21% abstain on test (v17:
# 58 / 25 / 17). Remove `gate` to fall back to them.
abstention:
  gate: narrative/outputs/top/gate
  reference: surrogate/outputs/top/features/features_val.parquet
  full_threshold: 1.0
  caveat_threshold: 2.0

glossary:
  path: narrative/configs/glossary_top.yaml
  # Refuse to build prompts from glossary entries still marked `draft`.
  # The physical readings go into the narrative, so they need sign-off.
  require_reviewed: true

prompt:
  path: narrative/prompts/prompt_top.yaml

llm:
  # Backend selects both the protocol and the credential:
  #
  #   aistudio   google-genai, api key           GOOGLE_API_KEY
  #   vertex     google-genai, ADC               gcloud application-default login
  #   deepseek   OpenAI-compatible               DEEPSEEK_API_KEY
  #   groq       OpenAI-compatible               GROQ_API_KEY
  #   vllm       OpenAI-compatible, served by us  none (VLLM_BASE_URL, default localhost:8000)
  #
  # `backend` and `model` are both overridable from the command line
  # (--backend, --model), which is how a sweep runs several providers against
  # one config without editing it in between.
  backend: vertex
  # Left empty on purpose: a Vertex project is specific to whoever is running
  # this, and the client reads GOOGLE_CLOUD_PROJECT (and GOOGLE_CLOUD_LOCATION)
  # from the environment, raising a message that says so if neither is set.
  project: null
  # "global", not a region: the Gemini 3.x models are served only from the
  # global endpoint and return 404 from every regional one (tested us-central1,
  # europe-west4). The 2.5 family is retired and returns 404 everywhere.
  location: global
  # The default for a single run; a sweep takes its models from `generators`
  # below, each with --backend/--model. gemini-3.5-flash-lite is the cheapest.
  # The verifier retries on failure, so a weak model trades cost against
  # attempts: measure the pass rate before settling on this.
  model: gemini-3.5-flash-lite
  temperature: 0.0
  seed: 42
  # Thinking tokens are drawn from this same budget, so it has to cover both.
  # Measured: a complete narrative runs ~1700-2000 output tokens. At 2048 the
  # reasoning models returned truncated narratives that failed verification for
  # lack of room rather than for lack of ability, so leave headroom for thinking.
  max_output_tokens: 8192
  # 0 disables reasoning; null leaves the model's default in place.
  # gemini-3.5-flash-lite does not reason by default; gemini-3.5-flash reasons
  # by default and obeys 0. The client records what actually happened for every
  # call, and falls back to no thinking_config if a model rejects the field.
  thinking_budget: 0
  # The PONTE loop (hercolelab/personalized_xai): up to five attempts, each
  # retry a rewrite of the rejected narrative by the same model, from the
  # verifier's failures and their history, at temperature 0.2 as PONTE's
  # refiner. Nothing is delivered if no attempt passes. The published v16 ran
  # max_attempts 1; its first-attempt rates are still read off attempt 0.
  max_attempts: 5
  retry_mode: refine
  refine_temperature: 0.2
  # retry_mode: resample only. Retries raise the temperature by this much per attempt. Advancing only the
  # seed is not enough: measured on the first run, 4 seeds at temperature 0
  # returned byte-identical text on 2 jets out of 5, so the loop re-failed
  # identically. The SDK only promises "best effort" determinism from a seed,
  # and here it delivers rather more than that.
  retry_temperature_step: 0.3

# The generators a sweep runs, in one place. `name` is the file suffix a run is
# written under (<block>_<name>.jsonl) and the key every report reads it back
# by; blocks_report and `judge.py --from-runs` take this list as their default.
# Chosen 2026-11-06 on a six-jet pilot against the current catalogue:
#   gemini-3.5-flash        5/6 verified; the Flash of the published v16, kept so
#                           that model is compared like for like. In the pilot
#                           3.6/3.7-flash were 6/6, 3.8 slow (~56 s), 4-argon
#                           rejects thinking_budget, 3.1-pro still preview; v17
#                           was first run with 3.7-flash (TOTAL 0.98 first try,
#                           1.00 delivered), its file left beside the others
#   gemini-3.5-flash-lite   3/6; no newer flash-lite exists, kept as the weak end
#   deepseek-flash          6/6; DeepSeek's own name, served by V4.1-Flash-1017.
#                           deepseek-v4-flash is a retired alias of the same model
#   gpt-oss-120b            0/6 on format; the open-weights reference, at the
#                           lowest effort it accepts (it cannot switch reasoning off).
#                           v17 ran it on Ollama Cloud, which no longer serves it
#                           free (2026-11-10); now served by us with vLLM on
#                           Leonardo, so v17 has to be regenerated for it (the
#                           Ollama file is not comparable: other kernels/quantisation)
# The published v16 results used gemini-3.5-flash and deepseek-v4-flash (V4 Flash,
# no longer served); pass --models to the reports to read those files.
generators:
  - {name: gemini-3.5-flash,      backend: vertex,   model: gemini-3.5-flash}
  - {name: gemini-3.5-flash-lite, backend: vertex,   model: gemini-3.5-flash-lite}
  - {name: deepseek-flash,        backend: deepseek, model: deepseek-flash}
  - {name: gpt-oss-120b,          backend: vllm,     model: gpt-oss-120b, reasoning_effort: low}
  # Qwen, served by us with vLLM (TODO.md): to be validated with the debug test
  # before their results count. Thinking switched off per request, so they are
  # compared without reasoning like the Gemini and DeepSeek runs.
  - {name: qwen3.8-27b,           backend: vllm,     model: qwen3.8-27b,
     extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  # Qwen3.8-Flash-Next was tried and dropped (2026-11-11): it needs a whole
  # node and its test sat in the queue for hours; the 27B is enough.
# The `vllm` generators run only inside scripts/slurm/vllm_generate.sbatch (the
# server is on the GPU node); scripts/run_generators.sh on the login node skips them.

outputs:
  stats: narrative/outputs/top/reference_stats
  narratives: narrative/outputs/top/narratives
