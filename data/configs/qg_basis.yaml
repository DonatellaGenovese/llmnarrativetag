dataset: QuarkGluon
# No FastJet params — all observables are analytic from constituents.

observables:
  # Tier A
  - w_pf
  - pTD
  - C_02
  - lambda_LHA
  - lambda_21
  - r_lambda
  - S_frag
  - ellipticity
  - mass
  - pT
  # Tier B
  - n_pf
  - n_Q
  # Tier C (PID)
  - S_PID
  - E_Q

targets:
  z_q: logit_jet_isQ
  z_g: logit_jet_isG
  t: logit_diff
  s: score_jet_isQ
  label: label

# Weaver class index 0 = quark (jet_isQ), 1 = gluon. t = z_Q − z_G.
positive_class_index: 0

prototype:
  seed: 42

fit:
  target_clip_percentiles: [0.5, 99.5]
  ridge_log_features: [mass, pT, n_pf, n_Q]
  ratio_clip_percentiles: [0.1, 99.9]
  ebm_interactions: 0
  ebm_max_bins: 256
  ebm_learning_rate: 0.01
  ebm_max_rounds: 5000

# QG has no official val files; carve this fraction from train (matches ParT --train-val-split).
train_val_split: 0.8889
